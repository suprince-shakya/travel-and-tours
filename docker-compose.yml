services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travels-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
    networks:
      - travels-network
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=travels
      - DB_USERNAME=travels_user
      - DB_PASSWORD=travels_pass
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - APP_URL=http://localhost

  mysql:
    image: mysql:8.0
    container_name: travels-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: travels
      MYSQL_USER: travels_user
      MYSQL_PASSWORD: travels_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - travels-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: travels-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./storage/app/public:/var/www/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - travels-network
    depends_on:
      - app

networks:
  travels-network:
    driver: bridge

volumes:
  mysql_data:
