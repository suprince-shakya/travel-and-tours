services:
  app:
    container_name: travels-website
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5008:80"
    env_file:
      - .dockerenv
    volumes:
      - ./storage_data:/var/www/storage/app
      - ./storage_framework:/var/www/storage/framework
      - ./storage_logs:/var/www/storage/logs
      - ./storage_data/public:/var/www/public/storage
    restart: unless-stopped
    networks:
      - shared-mysql-network

networks:
  shared-mysql-network:
    external: true

